<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | MediCare'">MediCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:fragment="shell(active)">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></div>
                <div><strong>MediCare</strong><small>Gestión Clínica</small></div>
            </div>
            <div class="menu-label">MENÚ PRINCIPAL</div>
            <nav class="nav flex-column">
                <a class="nav-link" th:classappend="${active=='dashboard'?'active':''}" href="/dashboard"><i
                        class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a class="nav-link" th:classappend="${active=='pacientes'?'active':''}" href="/pacientes"><i
                        class="bi bi-people-fill"></i> Pacientes</a>
                <a class="nav-link" th:classappend="${active=='citas'?'active':''}" href="/citas"><i
                        class="bi bi-calendar2-week-fill"></i> Citas</a>
                <a class="nav-link" th:classappend="${active=='historias'?'active':''}" href="/historias"><i
                        class="bi bi-file-earmark-medical-fill"></i> Historias clínicas</a>
            </nav>
            <div class="sidebar-user">
                <div class="avatar">AD</div>
                <div><strong>Administrador</strong><small>Personal médico</small></div>
            </div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <button class="btn btn-light d-lg-none" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i>
                </button>
                <div class="search-top"><i class="bi bi-search"></i><input placeholder="Buscar en el sistema..."></div>
                <div class="top-actions">
                    <button class="icon-btn"><i class="bi bi-bell"></i><span></span></button>
                    <div class="top-avatar">AD</div>
                </div>
            </header>
            <div class="content-area" th:insert="~{::content}"></div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
